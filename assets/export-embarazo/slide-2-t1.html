<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0F2446;font-family:'Work Sans',sans-serif}
.frame{position:relative;width:1080px;height:1920px}
.brand{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:16px}
.brand img{width:48px;height:auto;display:block}
.brand span{font-size:19px;color:#F3E4DE;letter-spacing:.03em;font-weight:500}
.dots{position:absolute;top:76px;right:64px;display:flex;gap:12px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #E4CCC5}
.dot.on{background:#E4CCC5}

.body{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 80px}
.icon-wrap{margin-bottom:40px}
.badge{background:#E4CCC5;color:#081833;font-weight:700;font-size:24px;letter-spacing:.04em;padding:12px 30px;border-radius:999px;text-transform:uppercase}
.weeks{margin-top:18px;color:#F3E4DE;font-size:23px;letter-spacing:.03em}

.divider{width:120px;height:2px;background:rgba(228,204,197,.4);margin:46px 0}

.stat{width:100%;max-width:820px;margin-bottom:38px}
.stat .label{display:flex;align-items:center;gap:12px;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:#E4CCC5;font-weight:700;margin-bottom:14px}
.stat .label::before{content:"";width:8px;height:8px;border-radius:50%;background:#E4CCC5}
.stat p{font-family:'Fraunces',Georgia,serif;color:#F6F1ED;font-size:32px;line-height:1.35;font-weight:500}
</style></head>
<body>
<div class="frame">
  <div class="brand"><img src="icon.png" alt=""><span>DRA. LALY BRICKLER</span></div>
  <div class="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>

  <div class="body">
    <div class="icon-wrap">
      <svg width="200" height="200" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="95" fill="none" stroke="#E4CCC5" stroke-width="2.5"/>
        <circle cx="110" cy="110" r="31" fill="#E4CCC5"/>
      </svg>
    </div>
    <span class="badge">Primer trimestre</span>
    <span class="weeks">Semanas 1 – 13</span>
    <div class="divider"></div>

    <div class="stat">
      <div class="label">Tu bebé</div>
      <p>Se forman el cerebro, la columna y el corazón. Para la semana 12, ya están presentes todos sus órganos principales.</p>
    </div>
    <div class="stat">
      <div class="label">Tu cuerpo</div>
      <p>Ausencia de periodo, náuseas, cansancio y sensibilidad en los senos — todo esto es completamente esperable.</p>
    </div>
  </div>
</div>
</body></html>
