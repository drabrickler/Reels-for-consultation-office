<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0F2446;font-family:'Work Sans',sans-serif}
.frame{position:relative;width:1080px;height:1920px}
.photo-layer{position:absolute;inset:0;background-image:url('foto1.webp');background-size:cover;background-position:center 20%;z-index:0}
.photo-tint{position:absolute;inset:0;background:#0F2446;opacity:.2;mix-blend-mode:multiply;z-index:1}
.photo-scrim{position:absolute;inset:0;background:linear-gradient(180deg, rgba(8,24,51,0) 0%, rgba(8,24,51,0) 34%, rgba(8,24,51,.64) 64%, rgba(8,24,51,.96) 100%);z-index:1}
.brand{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:16px;z-index:3}
.brand img{width:48px;height:auto;display:block}
.brand span{font-size:19px;color:#F3E4DE;letter-spacing:.03em;font-weight:500}
.body{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding:0 78px 86px}
.hook{font-family:'Fraunces',Georgia,serif;font-weight:500;color:#F6F1ED;font-size:58px;line-height:1.24;text-wrap:balance}
.hook em{font-style:normal;color:#E4CCC5}
.swipe{margin-top:48px;text-align:center;font-size:21px;color:#E4CCC5;letter-spacing:.04em;font-weight:500}
</style></head>
<body>
<div class="frame">
  <div class="photo-layer"></div>
  <div class="photo-tint"></div>
  <div class="photo-scrim"></div>
  <div class="brand"><img src="icon.png" alt=""><span>DRA. LALY BRICKLER</span></div>
  <div class="body">
    <p class="hook">Primer, segundo o <em>tercer trimestre</em> — esto es lo que tu cuerpo, y tu bebé, están haciendo ahora.</p>
    <p class="swipe">Desliza para ver cada etapa →</p>
  </div>
</div>
</body></html>
