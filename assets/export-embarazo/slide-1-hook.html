<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0F2446;font-family:'Work Sans',sans-serif}
.frame{position:relative;width:1080px;height:1920px}
.loop-field{position:absolute;inset:0;opacity:.16;background:
  radial-gradient(circle at 15% 8%, #E4CCC5 0, transparent 30%),
  radial-gradient(circle at 88% 14%, #E4CCC5 0, transparent 26%),
  radial-gradient(circle at 20% 92%, #E4CCC5 0, transparent 28%);
  pointer-events:none}
.brand{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:16px}
.brand img{width:48px;height:auto;display:block}
.brand span{font-size:19px;color:#F3E4DE;letter-spacing:.03em;font-weight:500}
.body{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 90px;text-align:center}
.hook{font-family:'Fraunces',Georgia,serif;font-weight:500;color:#F6F1ED;font-size:66px;line-height:1.22;text-wrap:balance}
.hook em{font-style:normal;color:#E4CCC5}
.swipe{position:absolute;bottom:100px;left:0;right:0;text-align:center;font-size:21px;color:#E4CCC5;letter-spacing:.04em;font-weight:500;line-height:1.3}
</style></head>
<body>
<div class="frame">
  <div class="loop-field"></div>
  <div class="brand"><img src="icon.png" alt=""><span>DRA. LALY BRICKLER</span></div>
  <div class="body">
    <p class="hook">Primer, segundo o <em>tercer trimestre</em> — esto es lo que tu cuerpo, y tu bebé, están haciendo ahora.</p>
  </div>
  <p class="swipe">Desliza para ver cada etapa →</p>
</div>
</body></html>
