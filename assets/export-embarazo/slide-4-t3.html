<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0F2446;font-family:'Work Sans',sans-serif}
.frame{position:relative;width:1080px;height:1920px}
.photo-layer{position:absolute;inset:0;background-image:url('foto4.webp');background-size:cover;background-position:center 18%;z-index:0}
.photo-tint{position:absolute;inset:0;background:#0F2446;opacity:.2;mix-blend-mode:multiply;z-index:1}
.photo-scrim{position:absolute;inset:0;background:linear-gradient(180deg, rgba(8,24,51,0) 0%, rgba(8,24,51,0) 40%, rgba(8,24,51,.68) 66%, rgba(8,24,51,.97) 100%);z-index:1}

.brand{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:16px;z-index:3}
.brand img{width:48px;height:auto;display:block}
.brand span{font-size:21px;color:#F3E4DE;letter-spacing:.03em;font-weight:600}
.dots{position:absolute;top:76px;right:64px;display:flex;gap:12px;z-index:3}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #E4CCC5}
.dot.on{background:#E4CCC5}

.body{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 72px 78px;text-align:center}
.badge-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.badge-row svg{flex:none}
.badge{background:#E4CCC5;color:#081833;font-weight:700;font-size:33px;letter-spacing:.02em;padding:16px 38px;border-radius:999px;text-transform:uppercase}
.weeks{color:#F3E4DE;font-size:30px;letter-spacing:.03em;margin-bottom:34px;font-weight:500}

.stat{width:100%;max-width:860px;margin-bottom:24px}
.stat .label{display:flex;align-items:center;justify-content:center;gap:12px;font-size:24px;letter-spacing:.06em;text-transform:uppercase;color:#E4CCC5;font-weight:700;margin-bottom:12px}
.stat .label::before{content:"";width:8px;height:8px;border-radius:50%;background:#E4CCC5}
.stat p{font-family:'Fraunces',Georgia,serif;color:#F6F1ED;font-size:40px;line-height:1.28;font-weight:500}
</style></head>
<body>
<div class="frame">
  <div class="photo-layer"></div>
  <div class="photo-tint"></div>
  <div class="photo-scrim"></div>
  <div class="brand"><img src="icon.png" alt=""><span>DRA. LALY BRICKLER</span></div>
  <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot on"></span></div>

  <div class="body">
    <div class="badge-row">
      <svg width="48" height="48" viewBox="0 0 220 220"><circle cx="110" cy="110" r="95" fill="none" stroke="#E4CCC5" stroke-width="7"/><circle cx="110" cy="110" r="93" fill="#E4CCC5"/></svg>
      <span class="badge">Tercer trimestre</span>
    </div>
    <span class="weeks">Semanas 28 – 40</span>

    <div class="stat">
      <div class="label">Tu bebé</div>
      <p>Madura el cerebro y los pulmones, gana grasa corporal y se acomoda en posición para nacer.</p>
    </div>
    <div class="stat">
      <div class="label">Tu cuerpo</div>
      <p>Contracciones de práctica, hinchazón y sentir que te falta el aire son parte de esta recta final.</p>
    </div>
  </div>
</div>
</body></html>
