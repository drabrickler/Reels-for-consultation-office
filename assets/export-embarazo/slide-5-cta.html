<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0F2446;font-family:'Work Sans',sans-serif}
.frame{position:relative;width:1080px;height:1920px}
.photo-layer{position:absolute;inset:0;background-image:url('foto5.webp');background-size:cover;background-position:center 30%;z-index:0}
.photo-tint{position:absolute;inset:0;background:#0F2446;opacity:.3;mix-blend-mode:multiply;z-index:1}
.photo-scrim{position:absolute;inset:0;background:linear-gradient(180deg, rgba(8,24,51,.25) 0%, rgba(8,24,51,.15) 28%, rgba(8,24,51,.72) 60%, rgba(8,24,51,.97) 100%);z-index:1}
.brand{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:16px;z-index:3}
.brand img{width:48px;height:auto;display:block}
.brand span{font-size:19px;color:#F3E4DE;letter-spacing:.03em;font-weight:500}

.body{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding:0 78px 110px}
.eyebrow{color:#E4CCC5;font-size:21px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:24px}
.cta-head{font-family:'Fraunces',Georgia,serif;color:#F6F1ED;font-size:50px;line-height:1.26;font-weight:500;max-width:860px;text-wrap:balance;margin-bottom:44px}
.cta-pill{display:inline-flex;align-items:center;gap:16px;background:#E4CCC5;color:#081833;font-weight:700;font-size:31px;padding:23px 36px;border-radius:999px;width:fit-content}
.cta-logo{display:flex;align-items:center;gap:22px;margin-top:50px}
.cta-logo img{width:68px;height:auto;display:block}
.cta-logo .ln{display:flex;flex-direction:column;line-height:1.3}
.cta-logo .ln b{font-family:'Fraunces',Georgia,serif;color:#F6F1ED;font-size:29px;font-weight:600}
.cta-logo .ln small{color:#F3E4DE;font-size:20px;letter-spacing:.03em}
</style></head>
<body>
<div class="frame">
  <div class="photo-layer"></div>
  <div class="photo-tint"></div>
  <div class="photo-scrim"></div>
  <div class="brand"><img src="icon.png" alt=""><span>DRA. LALY BRICKLER</span></div>
  <div class="body">
    <span class="eyebrow">Control prenatal · parto</span>
    <p class="cta-head">Cada etapa trae cambios distintos — y mereces acompañamiento en cada una.</p>
    <span class="cta-pill">Agenda tu control prenatal →</span>
    <div class="cta-logo">
      <img src="icon.png" alt="">
      <span class="ln"><b>Dra. Laly Brickler</b><small>CIMA · Torre Médica I · Escazú</small></span>
    </div>
  </div>
</div>
</body></html>
