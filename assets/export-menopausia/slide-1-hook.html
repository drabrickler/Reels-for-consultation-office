<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0F2446;font-family:'Work Sans',sans-serif}
.frame{position:relative;width:1080px;height:1920px;display:flex;flex-direction:column}
.frame-photo-top{position:relative;flex:0 0 900px;background-image:url('foto1-crop.webp');background-size:cover;background-position:center 30%;z-index:0}
.frame-photo-top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(8,24,51,.5) 0%, rgba(8,24,51,0) 14%, rgba(15,36,70,0) 55%, #0F2446 100%)}
.brand{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:16px;z-index:3}
.brand img{width:48px;height:auto;display:block}
.brand span{font-size:25px;color:#F3E4DE;letter-spacing:.03em;font-weight:600}
.dots{position:absolute;top:78px;right:64px;display:flex;gap:11px;z-index:3}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #E4CCC5}
.dot.on{background:#E4CCC5}

.body{position:relative;flex:1;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 80px 30px;text-align:center}
.eyebrow{color:#E4CCC5;font-size:29px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:34px}
.headline{font-family:'Fraunces',Georgia,serif;font-weight:600;color:#F6F1ED;font-size:76px;line-height:1.14;text-wrap:balance}
.headline em{font-style:normal;color:#E4CCC5}
.sub{margin-top:40px;font-size:34px;color:#F3E4DE;line-height:1.45;max-width:800px}
</style></head>
<body>
<div class="frame">
  <div class="frame-photo-top"></div>
  <div class="brand"><img src="icon.png" alt=""><span>DRA. LALY BRICKLER</span></div>
  <div class="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="body">
    <span class="eyebrow">Día Mundial de la Menopausia · 18 oct</span>
    <p class="headline">La FDA acaba de <em>revertir</em> una advertencia de hace 22 años.</p>
    <p class="sub">Y este año hay una noticia que muy pocas mujeres conocen.</p>
  </div>
</div>
</body></html>
