<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0F2446;font-family:'Work Sans',sans-serif}
.frame{position:relative;width:1080px;height:1920px}
.loop-field{position:absolute;inset:0;opacity:.15;background:
  radial-gradient(circle at 15% 12%, #E4CCC5 0, transparent 30%),
  radial-gradient(circle at 85% 88%, #E4CCC5 0, transparent 28%);
  pointer-events:none}
.brand{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:16px;z-index:3}
.brand img{width:48px;height:auto;display:block}
.brand span{font-size:23px;color:#F3E4DE;letter-spacing:.03em;font-weight:600}
.dots{position:absolute;top:76px;right:64px;display:flex;gap:11px;z-index:3}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid #E4CCC5}
.dot.on{background:#E4CCC5}

.body{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 88px;text-align:center}
.eyebrow{color:#E4CCC5;font-size:26px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-bottom:34px}
.headline{font-family:'Fraunces',Georgia,serif;font-weight:600;color:#F6F1ED;font-size:76px;line-height:1.14;max-width:860px;text-wrap:balance;margin-bottom:40px}
.headline em{font-style:normal;color:#E4CCC5}
.sub{font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:34px;color:#E4CCC5;line-height:1.4;max-width:760px}
</style></head>
<body>
<div class="frame">
  <div class="loop-field"></div>
  <div class="brand"><img src="icon.png" alt=""><span>DRA. LALY BRICKLER</span></div>
  <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot on"></span><span class="dot"></span></div>
  <div class="body">
    <span class="eyebrow">Tema 2026 · Día Mundial de la Menopausia</span>
    <p class="headline">Dolor crónico<br>en la <em>mediana edad</em>.</p>
    <p class="sub">La menopausia no es solo bochornos.</p>
  </div>
</div>
</body></html>
