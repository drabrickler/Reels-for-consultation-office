<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0F2446;font-family:'Work Sans',sans-serif}
.frame{position:relative;width:1080px;height:1920px}
.photo-layer{position:absolute;inset:0;background-image:url('foto1.webp');background-size:cover;background-position:center 18%;z-index:0}
.photo-tint{position:absolute;inset:0;background:#0F2446;opacity:.22;mix-blend-mode:multiply;z-index:1}
.photo-scrim{position:absolute;inset:0;background:linear-gradient(180deg, rgba(8,24,51,0) 0%, rgba(8,24,51,0) 32%, rgba(8,24,51,.66) 62%, rgba(8,24,51,.97) 100%);z-index:1}
.brand{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:16px;z-index:3}
.brand img{width:48px;height:auto;display:block}
.brand span{font-size:23px;color:#F3E4DE;letter-spacing:.03em;font-weight:600}
.body{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 80px 130px;text-align:center}
.headline{font-family:'Fraunces',Georgia,serif;font-weight:600;color:#E4CCC5;font-size:106px;line-height:1.03;margin-bottom:40px}
.sub{font-family:'Fraunces',Georgia,serif;font-weight:500;color:#F6F1ED;font-size:44px;line-height:1.3;max-width:860px;text-wrap:balance}
</style></head>
<body>
<div class="frame">
  <div class="photo-layer"></div>
  <div class="photo-tint"></div>
  <div class="photo-scrim"></div>
  <div class="brand"><img src="icon.png" alt=""><span>DRA. LALY BRICKLER</span></div>
  <div class="body">
    <p class="headline">Tiene nombre.<br>Tiene manejo.</p>
    <p class="sub">Si sientes que tu deseo sexual "desapareció", probablemente hay una causa — y tiene manejo.</p>
  </div>
</div>
</body></html>
