<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0F2446;font-family:'Work Sans',sans-serif}
.frame{position:relative;width:1080px;height:1920px}
.loop-field{position:absolute;inset:0;opacity:.17;background:
  radial-gradient(circle at 14% 10%, #E4CCC5 0, transparent 30%),
  radial-gradient(circle at 88% 16%, #E4CCC5 0, transparent 27%),
  radial-gradient(circle at 22% 90%, #E4CCC5 0, transparent 28%);
  pointer-events:none}
.brand{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:16px}
.brand img{width:48px;height:auto;display:block}
.brand span{font-size:21px;color:#F3E4DE;letter-spacing:.03em;font-weight:600}
.body{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 90px;text-align:center}
.headline{font-family:'Fraunces',Georgia,serif;font-weight:600;color:#E4CCC5;font-size:108px;line-height:1.02;margin-bottom:40px}
.sub{font-family:'Fraunces',Georgia,serif;font-weight:500;color:#F6F1ED;font-size:44px;line-height:1.3;max-width:840px;text-wrap:balance}
</style></head>
<body>
<div class="frame">
  <div class="loop-field"></div>
  <div class="brand"><img src="icon.png" alt=""><span>DRA. LALY BRICKLER</span></div>
  <div class="body">
    <p class="headline">Tiene nombre.<br>Tiene manejo.</p>
    <p class="sub">Si sientes que tu deseo sexual "desapareció", no estás sola — y esto no es casualidad.</p>
  </div>
</div>
</body></html>
