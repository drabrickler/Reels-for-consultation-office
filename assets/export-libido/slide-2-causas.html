<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0F2446;font-family:'Work Sans',sans-serif}
.frame{position:relative;width:1080px;height:1920px;display:flex;flex-direction:column}
.frame-photo-top{position:relative;flex:0 0 620px;background-image:url('foto2.webp');background-size:cover;background-position:center 22%;z-index:0}
.frame-photo-top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(8,24,51,.55) 0%, rgba(8,24,51,0) 16%, rgba(15,36,70,0) 48%, #0F2446 100%)}
.brand{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:16px;z-index:3}
.brand img{width:48px;height:auto;display:block}
.brand span{font-size:21px;color:#F3E4DE;letter-spacing:.03em;font-weight:600}

.body{position:relative;flex:1;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 80px 40px;text-align:center}
.eyebrow{color:#E4CCC5;font-size:26px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-bottom:30px}

.causes{display:flex;flex-direction:column;gap:20px;width:100%;max-width:780px}
.cause{
  display:flex;align-items:center;gap:20px;
  background:linear-gradient(165deg, rgba(228,204,197,.14), rgba(228,204,197,.04));
  border:1px solid rgba(228,204,197,.3);
  border-radius:22px;
  padding:22px 32px;
  text-align:left;
}
.cause .n{
  font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:27px;
  color:#0F2446;background:#E4CCC5;
  width:50px;height:50px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.cause .t{font-family:'Fraunces',Georgia,serif;color:#F6F1ED;font-size:33px;font-weight:600}

.not-psych{margin-top:40px;font-family:'Fraunces',Georgia,serif;font-style:italic;color:#E4CCC5;font-size:27px;text-align:center;max-width:740px;line-height:1.4}
</style></head>
<body>
<div class="frame">
  <div class="frame-photo-top"></div>
  <div class="brand"><img src="icon.png" alt=""><span>DRA. LALY BRICKLER</span></div>
  <div class="body">
    <span class="eyebrow">Tu libido puede cambiar por</span>
    <div class="causes">
      <div class="cause"><span class="n">1</span><span class="t">Anticonceptivos</span></div>
      <div class="cause"><span class="n">2</span><span class="t">Posparto</span></div>
      <div class="cause"><span class="n">3</span><span class="t">Estrés</span></div>
      <div class="cause"><span class="n">4</span><span class="t">Edad</span></div>
    </div>
    <p class="not-psych">Causas médicas reales — no "solo en tu cabeza".</p>
  </div>
</div>
</body></html>
