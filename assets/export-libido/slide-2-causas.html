<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0F2446;font-family:'Work Sans',sans-serif}
.frame{position:relative;width:1080px;height:1920px}
.loop-field{position:absolute;inset:0;opacity:.14;background:
  radial-gradient(circle at 85% 8%, #E4CCC5 0, transparent 28%),
  radial-gradient(circle at 10% 85%, #E4CCC5 0, transparent 30%);
  pointer-events:none}
.brand{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:16px}
.brand img{width:48px;height:auto;display:block}
.brand span{font-size:21px;color:#F3E4DE;letter-spacing:.03em;font-weight:600}

.body{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 80px;text-align:center}
.eyebrow{color:#E4CCC5;font-size:26px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-bottom:28px}
.title{font-family:'Fraunces',Georgia,serif;color:#F6F1ED;font-size:52px;line-height:1.22;font-weight:500;max-width:820px;text-wrap:balance;margin-bottom:64px}

.causes{display:flex;flex-direction:column;gap:26px;width:100%;max-width:760px}
.cause{
  display:flex;align-items:center;gap:22px;
  background:linear-gradient(165deg, rgba(228,204,197,.14), rgba(228,204,197,.04));
  border:1px solid rgba(228,204,197,.3);
  border-radius:24px;
  padding:28px 36px;
  text-align:left;
}
.cause .n{
  font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:30px;
  color:#0F2446;background:#E4CCC5;
  width:56px;height:56px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.cause .t{font-family:'Fraunces',Georgia,serif;color:#F6F1ED;font-size:36px;font-weight:600}

.not-psych{margin-top:56px;font-family:'Fraunces',Georgia,serif;font-style:italic;color:#E4CCC5;font-size:30px;text-align:center;max-width:740px;line-height:1.4}
</style></head>
<body>
<div class="frame">
  <div class="loop-field"></div>
  <div class="brand"><img src="icon.png" alt=""><span>DRA. LALY BRICKLER</span></div>
  <div class="body">
    <span class="eyebrow">Tu libido puede cambiar por</span>
    <div class="causes">
      <div class="cause"><span class="n">1</span><span class="t">Anticonceptivos</span></div>
      <div class="cause"><span class="n">2</span><span class="t">Posparto</span></div>
      <div class="cause"><span class="n">3</span><span class="t">Estrés</span></div>
      <div class="cause"><span class="n">4</span><span class="t">Edad</span></div>
    </div>
    <p class="not-psych">Causas médicas reales — no "solo en tu cabeza".</p>
  </div>
</div>
</body></html>
