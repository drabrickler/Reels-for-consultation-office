<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0F2446;font-family:'Work Sans',sans-serif}
.frame{position:relative;width:1080px;height:1920px}
.photo-layer{position:absolute;inset:0;background-image:url('foto3.webp');background-size:cover;background-position:center 18%;z-index:0}
.photo-tint{position:absolute;inset:0;background:#0F2446;opacity:.2;mix-blend-mode:multiply;z-index:1}
.photo-scrim{position:absolute;inset:0;background:linear-gradient(180deg, rgba(8,24,51,0) 0%, rgba(8,24,51,0) 38%, rgba(8,24,51,.7) 66%, rgba(8,24,51,.97) 100%);z-index:1}
.body{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding:0 78px 110px}
.eyebrow{color:#E4CCC5;font-size:29px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-bottom:32px}
.cta-head{font-family:'Fraunces',Georgia,serif;color:#F6F1ED;font-size:62px;line-height:1.2;font-weight:500;max-width:900px;text-wrap:balance;margin-bottom:50px}
.cta-pill{display:inline-flex;align-items:center;gap:16px;background:#E4CCC5;color:#081833;font-weight:700;font-size:39px;padding:27px 44px;border-radius:999px;width:fit-content}
.cta-logo{display:flex;align-items:center;gap:22px;margin-top:52px}
.cta-logo img{width:68px;height:auto;display:block}
.cta-logo .ln{display:flex;flex-direction:column;line-height:1.3}
.cta-logo .ln b{font-family:'Fraunces',Georgia,serif;color:#F6F1ED;font-size:35px;font-weight:600}
.cta-logo .ln small{color:#F3E4DE;font-size:23px;letter-spacing:.03em}
</style></head>
<body>
<div class="frame">
  <div class="photo-layer"></div>
  <div class="photo-tint"></div>
  <div class="photo-scrim"></div>
  <div class="body">
    <span class="eyebrow">Salud sexual femenina</span>
    <p class="cta-head">Es un tema médico. Como cualquier otro. Hablémoslo en consulta, sin pena.</p>
    <span class="cta-pill">Agenda tu consulta →</span>
    <div class="cta-logo">
      <img src="icon.png" alt="">
      <span class="ln"><b>Dra. Laly Brickler</b><small>CIMA · Torre Médica I · Escazú</small></span>
    </div>
  </div>
</div>
</body></html>
