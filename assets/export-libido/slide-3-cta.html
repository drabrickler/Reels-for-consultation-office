<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0F2446;font-family:'Work Sans',sans-serif}
.frame{position:relative;width:1080px;height:1920px}
.loop-field{position:absolute;inset:0;opacity:.16;background:
  radial-gradient(circle at 88% 12%, #E4CCC5 0, transparent 30%),
  radial-gradient(circle at 10% 20%, #E4CCC5 0, transparent 26%),
  radial-gradient(circle at 78% 92%, #E4CCC5 0, transparent 28%);
  pointer-events:none}
.body{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 86px}
.eyebrow{color:#E4CCC5;font-size:25px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:30px}
.cta-head{font-family:'Fraunces',Georgia,serif;color:#F6F1ED;font-size:62px;line-height:1.2;font-weight:500;max-width:880px;text-wrap:balance;margin-bottom:50px}
.cta-pill{display:inline-flex;align-items:center;gap:16px;background:#E4CCC5;color:#081833;font-weight:700;font-size:36px;padding:26px 42px;border-radius:999px;width:fit-content}
.cta-logo{display:flex;align-items:center;gap:22px;margin-top:58px}
.cta-logo img{width:72px;height:auto;display:block}
.cta-logo .ln{display:flex;flex-direction:column;line-height:1.3}
.cta-logo .ln b{font-family:'Fraunces',Georgia,serif;color:#F6F1ED;font-size:33px;font-weight:600}
.cta-logo .ln small{color:#F3E4DE;font-size:22px;letter-spacing:.03em}
</style></head>
<body>
<div class="frame">
  <div class="loop-field"></div>
  <div class="body">
    <span class="eyebrow">Salud sexual femenina</span>
    <p class="cta-head">Es un tema médico. Como cualquier otro. Hablémoslo en consulta, sin pena.</p>
    <span class="cta-pill">Agenda tu consulta →</span>
    <div class="cta-logo">
      <img src="icon.png" alt="">
      <span class="ln"><b>Dra. Laly Brickler</b><small>CIMA · Torre Médica I · Escazú</small></span>
    </div>
  </div>
</div>
</body></html>
